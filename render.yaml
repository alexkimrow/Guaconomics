services:
  - type: web
    name: guaconomics-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn api:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: MODEL_URL
        sync: false
